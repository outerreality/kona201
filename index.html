<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<title>Route 201 · Aliʻi Dr</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0e1014; --panel:#171a21; --panel2:#1f232c; --line:#2a2f3a;
  --text:#eef0f4; --muted:#8b93a3; --dim:#555d6c;
  --accent:#ff4fd8; --accent2:#ff8ae6; --me:#3d9bff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(var(--bg) 70%,rgba(14,16,20,0));position:relative;z-index:3}
.title{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.badge{background:var(--accent);color:#1a0716;font-weight:800;border-radius:8px;padding:3px 8px;font-size:15px;letter-spacing:.3px}
.title h1{font-size:17px;margin:0;font-weight:650}
.title .sub{font-size:12px;color:var(--muted);margin-left:auto;text-align:right}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;position:relative}
.seg button{all:unset;text-align:center;padding:8px 4px;border-radius:9px;cursor:pointer;position:relative;z-index:1;transition:color .2s}
.seg button b{display:block;font-size:14px;font-weight:650}
.seg button small{display:block;font-size:11px;color:var(--muted);transition:color .2s}
.seg button.on{color:#1a0716}
.seg button.on small{color:#4a1840}
.seg .pill{position:absolute;top:3px;bottom:3px;width:calc(50% - 3px);left:3px;background:var(--accent);border-radius:9px;transition:transform .25s cubic-bezier(.3,.7,.3,1)}
.seg.s .pill{transform:translateX(100%)}
#map{flex:1;position:relative;touch-action:none;margin-top:-18px}
svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ctx{fill:none;stroke:#262b35;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.route-glow{fill:none;stroke:var(--accent);stroke-opacity:.18;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.route{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.arrow{fill:var(--accent)}
.stop circle.o{fill:var(--bg);stroke:var(--accent);stroke-width:3}
.stop circle.i{fill:var(--accent)}
.stop.end circle.o{stroke:#fff}
.stop.sel circle.o{fill:var(--accent);stroke:#fff}
.stop text{font-size:12px;fill:var(--text);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.stop text .c{font-weight:700;fill:var(--accent2)}
.stop text .n{fill:#c9ced8}
.hit{fill:transparent}
.ocean{font-size:12px;letter-spacing:4px;fill:#2c4a66;font-weight:600}
.me-acc{fill:var(--me);fill-opacity:.15;stroke:var(--me);stroke-opacity:.35}
.me{fill:var(--me);stroke:#fff;stroke-width:3}
.fab{position:absolute;right:14px;width:46px;height:46px;border-radius:14px;background:var(--panel);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--text);cursor:pointer;z-index:2;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab svg{position:static;width:22px;height:22px}
#locBtn{bottom:calc(18px + env(safe-area-inset-bottom))}
#fitBtn{bottom:calc(72px + env(safe-area-inset-bottom))}
#locBtn.on{color:var(--me);border-color:#2b5f99}
#near{position:absolute;left:14px;right:72px;bottom:calc(18px + env(safe-area-inset-bottom));background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:8px 12px;z-index:2;display:none;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#near small{color:var(--muted);font-size:11px;display:block}
#near span{font-size:14px;font-weight:600}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:8px 14px;
  border-radius:12px;font-size:13px;z-index:4;opacity:0;pointer-events:none;transition:opacity .25s;max-width:88%;text-align:center}
#toast.show{opacity:1}
/* sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  padding:8px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.3,.7,.3,1);
  max-height:78vh;overflow:auto;box-shadow:0 -10px 30px rgba(0,0,0,.5)}
#sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sh-top{display:flex;gap:12px;align-items:flex-start}
.code{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 9px;text-align:center;min-width:56px}
.code small{display:block;font-size:10px;color:var(--muted);letter-spacing:.5px}
.code b{font-size:18px;color:var(--accent2)}
.sh-top h2{font-size:16px;margin:2px 0 2px;font-weight:650}
.sh-top .dir{font-size:12px;color:var(--muted)}
.x{all:unset;margin-left:auto;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);cursor:pointer;flex:none;color:var(--muted)}
.next{margin:14px 0 12px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;align-items:baseline;gap:10px}
.next .lbl{font-size:12px;color:var(--muted)}
.next .t{font-size:24px;font-weight:700}
.next .in{margin-left:auto;color:var(--accent2);font-weight:650;font-size:14px}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.days button{all:unset;text-align:center;padding:7px 2px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px;cursor:pointer;color:var(--muted)}
.days button.on{color:var(--text);border-color:var(--accent)}
.days button i{display:block;font-style:normal;font-size:10px;color:var(--accent2);height:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid div{text-align:center;padding:8px 0;border-radius:9px;background:var(--panel2);font-variant-numeric:tabular-nums;font-size:14px}
.grid div.past{color:var(--dim);background:transparent}
.grid div.nx{background:var(--accent);color:#1a0716;font-weight:700}
.note{font-size:11.5px;color:var(--muted);margin-top:12px}
#scrim{position:fixed;inset:0;z-index:4;display:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title"><span class="badge">201</span><h1>Aliʻi Dr Trolley</h1><div class="sub" id="clock"></div></div>
    <div class="seg" id="seg">

      <button data-d="N"><b>Northbound</b><small>Keauhou → Kailua</small></button>
      <button data-d="S"><b>Southbound</b><small>Kailua → Keauhou</small></button>
    </div>

  <div id="map">
    <svg id="svg"></svg>
    <div id="toast"></div>
    <div id="near"><small>Nearest Stop</small><span id="nearTxt"></span></div>

    <div class="fab" id="locBtn" title="My Location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></div>
  </div>
</div>
<div id="scrim"></div>
<div id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

  let nextHtml='';
  if(isToday){
    if(nx){const m=toMin(nx)-T.min;nextHtml=`<div class="next"><span class="lbl">${isEnd?'Next Arrival':'Next Bus'}</span><span class="t">${fmt(nx)}</span><span class="in">${m===0?'Now':m<60?'In '+m+' Min':'In '+Math.floor(m/60)+' Hr '+(m%60)+' Min'}</span></div>`}
    else nextHtml=`<div class="next"><span class="lbl">Service Ended For Today</span><span class="in">First Bus Tomorrow</span></div>`;
  } else nextHtml='<div style="height:12px"></div>';
  const dirTxt=dir==='N'?'Northbound To Kona Commons':'Southbound To Keauhou';
  $('#sheetBody').innerHTML=`
    <div class="sh-top"><div class="code"><small>STOP</small><b>${s.code}</b></div>
      <div><h2>${s.name}</h2><div class="dir">${dirTxt}${isEnd?' · End Of Line':''}</div></div>
      <button class="x" id="xBtn" aria-label="Close">✕</button></div>
    ${nextHtml}
    <div class="days">${DAYS.map(([k,l])=>`<button data-k="${k}" class="${k===sheetDay?'on':''}"><i>${k===T.svc?(T.holiday?'Today · Holiday':'Today'):''}</i>${l}</button>`).join('')}</div>
    <div class="grid">${times.map(t=>`<div class="${isToday&&t===nx?'nx':isToday&&toMin(t)<T.min?'past':''}">${fmtShort(t)}</div>`).join('')}</div>
    <div class="note">${isEnd?'Arrival times at the end of the southbound run. ':''}Scheduled times from Hele-On GTFS (feed ${D.feed}). Holidays run the Sunday schedule. Times may vary with traffic.</div>`;
  $('#xBtn').onclick=closeSheet;
  document.querySelectorAll('.days button').forEach(b=>b.onclick=()=>{sheetDay=b.dataset.k;openSheet(code,true)});
  $('#sheet').classList.add('open');$('#scrim').style.display='block';$('#scrim').dispatchEvent(new Event('reset'));draw();
}
function closeSheet(){selCode=null;$('#sheet').classList.remove('open');$('#scrim').style.display='none';draw()}
// close only on a fresh tap that starts AND ends on the scrim (ignores the ghost click from the opening tap)
(()=>{const sc=$('#scrim');let down=false;
  sc.addEventListener('pointerdown',()=>{down=true});
  sc.addEventListener('pointerup',()=>{if(down)closeSheet();down=false});
  sc.addEventListener('click',e=>{e.preventDefault();e.stopPropagation()});})();
// swipe down to close
(()=>{let y0=null;const sh=$('#sheet');sh.addEventListener('touchstart',e=>{y0=sh.scrollTop<=0?e.touches[0].clientY:null},{passive:true});
  sh.addEventListener('touchend',e=>{if(y0!==null&&e.changedTouches[0].clientY-y0>70)closeSheet();y0=null})})();

// ---------- Location ----------
function toast(t,ms=3200){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove('show'),ms)}
function updateNear(){
  const n=$('#near');if(!me){n.style.display='none';return}
  let best=null,bd=1e12;for(const s of D.dirs[dir].stops){const d=Math.hypot(s.xy[0]-me.xy[0],s.xy[1]-me.xy[1]);if(d<bd){bd=d;best=s}}
  const dist=bd<1000?Math.round(bd/10)*10+' m':(bd/1000).toFixed(1)+' km';
  const mi=bd*0.000621371;$('#nearTxt').textContent=`${best.code} · ${best.short} · ${mi<0.1?Math.round(bd*3.281)+' ft':mi.toFixed(1)+' mi'}`;
  n.onclick=()=>openSheet(best.code);n.style.display='block';
}
$('#locBtn').onclick=()=>{
  if(!('geolocation' in navigator)){toast('Location Is Not Available In This Browser');return}
  if(me){ // recenter
    animateTo({s:Math.max(view.s,0.25),x:me.xy[0],y:me.xy[1]},350);return}
  toast('Finding Your Location…',6000);
  watchId=navigator.geolocation.watchPosition(p=>{
    const first=!me;me={xy:toM(p.coords.latitude,p.coords.longitude),acc:p.coords.accuracy};
    $('#locBtn').classList.add('on');updateNear();
    if(first){$('#toast').classList.remove('show');
      const far=Math.hypot(me.xy[0],me.xy[1])>15000;
      if(far)toast('You Are Away From The Route — Showing Your Position Anyway');
      else animateTo({s:Math.max(view.s,0.2),x:me.xy[0],y:me.xy[1]},400)}
    draw();
  },err=>{toast(err.code===1?'Location Permission Was Denied — Allow It In Chrome Site Settings':'Could Not Get Your Location — Try Again Outside',4500)},
  {enableHighAccuracy:true,maximumAge:5000,timeout:30000});
};

// ---------- Clock / refresh ----------
function tick(){const n=hiNow();const h=Math.floor(n.min/60),m=n.min%60;$('#clock').innerHTML=`Hawaiʻi Time<br><b style="color:var(--text);font-size:13px">${fmt(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'))}</b>`;
  if(selCode&&$('#sheet').classList.contains('open'))openSheet(selCode,true)}
setInterval(tick,30000);tick();
window.addEventListener('resize',()=>fit(false));
setDir(dir,false);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
